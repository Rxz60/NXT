<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

html,body{
    width:100%;
    min-height:100%;
    background:#000;
}

body{
    font-family:'Cairo',sans-serif;
    color:#fff;
    overflow-x:hidden;
}

/* خلفية سوداء بالكامل */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:#000;
    z-index:-2;
}

/* تأثير خفيف جداً بالخلفية */
body::after{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(
            circle at 50% 15%,
            rgba(255,255,255,.06),
            transparent 35%
        );
    z-index:-1;
    pointer-events:none;
}

/* الصفحة */
.main{
    width:100%;
    min-height:100vh;
    padding:25px 22px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* الشعار */
.logo{
    font-family:Arial,sans-serif;
    font-size:58px;
    font-weight:900;
    letter-spacing:10px;
    color:#fff;
    text-shadow:
        0 0 10px rgba(255,255,255,.35),
        0 0 30px rgba(255,255,255,.12);
    margin-bottom:55px;
}

/* القائمة */
.menu{
    width:100%;
    max-width:750px;
    display:flex;
    flex-direction:column;
    gap:30px;
}

/* الخانة */
.menu-card{
    width:100%;
    min-height:205px;
    background:#000;
    border:3px solid #fff;
    border-radius:40px;

    display:flex;
    align-items:center;

    padding:28px 55px;

    cursor:pointer;

    box-shadow:
        0 0 10px rgba(255,255,255,.18),
        inset 0 0 25px rgba(255,255,255,.025);

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        background .25s ease;
}

.menu-card:active{
    transform:scale(.97);
}

.menu-card:hover{
    background:#050505;
    box-shadow:
        0 0 25px rgba(255,255,255,.28),
        inset 0 0 30px rgba(255,255,255,.04);
}

/* الأيقونة */
.icon-box{
    width:125px;
    height:125px;

    flex-shrink:0;

    border:3px solid #fff;
    border-radius:32px;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
        0 0 18px rgba(255,255,255,.2),
        inset 0 0 20px rgba(255,255,255,.03);
}

/* SVG */
.icon-box svg{
    width:72px;
    height:72px;
    stroke:#fff;
    stroke-width:1.8;
    fill:none;
}

/* النص */
.card-text{
    flex:1;
    text-align:center;
    color:#fff;

    font-size:36px;
    font-weight:900;

    line-height:1.35;

    margin-right:35px;

    text-shadow:
        0 0 10px rgba(255,255,255,.2);
}

.card-text span{
    display:block;
    font-family:Arial,sans-serif;
    font-size:31px;
    direction:ltr;
    margin-top:2px;
}

/* للجوال */
@media(max-width:600px){

    .main{
        padding:20px 18px 35px;
    }

    .logo{
        font-size:52px;
        letter-spacing:8px;
        margin-bottom:50px;
    }

    .menu{
        gap:28px;
    }

    .menu-card{
        min-height:170px;
        padding:22px 28px;
        border-radius:35px;
    }

    .icon-box{
        width:105px;
        height:105px;
        border-radius:29px;
    }

    .icon-box svg{
        width:62px;
        height:62px;
    }

    .card-text{
        font-size:29px;
        margin-right:20px;
    }

    .card-text span{
        font-size:26px;
    }
}

/* شاشات صغيرة جداً */
@media(max-width:400px){

    .logo{
        font-size:45px;
    }

    .menu-card{
        min-height:145px;
        padding:18px;
        border-radius:30px;
    }

    .icon-box{
        width:88px;
        height:88px;
        border-radius:25px;
    }

    .icon-box svg{
        width:52px;
        height:52px;
    }

    .card-text{
        font-size:23px;
        margin-right:12px;
    }

    .card-text span{
        font-size:21px;
    }
}
</style>
