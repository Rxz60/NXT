<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<link rel="icon" type="image/png" href="https://files.catbox.moe/z10byb.jpg">
<title>FG — Android</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>

<style>
:root{
    --fg-black:#020202;
    --fg-dark:#070707;
    --fg-panel:#0b0b0b;
    --fg-panel2:#101010;
    --fg-border:rgba(255,255,255,.10);
    --fg-border-strong:rgba(255,255,255,.20);
    --fg-white:#fff;
    --fg-silver:#bdbdbd;
    --fg-muted:#666;
    --fg-glow:rgba(255,255,255,.12);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
    outline:none!important;
    text-decoration:none!important;
}

html{
    scroll-behavior:smooth;
    background:#000;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 50% -10%,rgba(255,255,255,.08),transparent 35%),
        radial-gradient(circle at 0% 100%,rgba(255,255,255,.035),transparent 30%),
        #020202;
    color:#fff;
    font-family:'Cairo',sans-serif;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    overflow-x:hidden;
    overflow-y:auto;
    position:relative;
    padding:35px 20px;
}

/* =========================
   FG BACKGROUND
========================= */

.fg-grid{
    position:fixed;
    inset:-100px;
    z-index:0;
    pointer-events:none;
    opacity:.45;
    background-image:
        linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
    background-size:55px 55px;
    animation:fgGrid 20s linear infinite;
}

@keyframes fgGrid{
    from{transform:translate(0,0)}
    to{transform:translate(55px,55px)}
}

.fg-noise{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    opacity:.035;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
}

.fg-glow{
    position:fixed;
    width:500px;
    height:500px;
    border-radius:50%;
    background:rgba(255,255,255,.035);
    filter:blur(100px);
    pointer-events:none;
    z-index:0;
    animation:fgGlow 9s ease-in-out infinite alternate;
}

.fg-glow.one{
    top:-250px;
    left:-180px;
}

.fg-glow.two{
    bottom:-300px;
    right:-200px;
    animation-delay:2s;
}

@keyframes fgGlow{
    from{transform:translate(0,0) scale(1)}
    to{transform:translate(50px,30px) scale(1.15)}
}

/* =========================
   FLOATING ICONS
========================= */

.floating-icons-layer{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
}

.floating-icon{
    position:absolute;
    color:rgba(255,255,255,.025);
    filter:drop-shadow(0 0 18px rgba(255,255,255,.04));
}

.floating-icon:nth-child(1){animation:float1 8s infinite alternate ease-in-out}
.floating-icon:nth-child(2){animation:float2 7s infinite alternate ease-in-out}
.floating-icon:nth-child(3){animation:float3 9s infinite alternate ease-in-out}
.floating-icon:nth-child(4){animation:float1 7s infinite alternate ease-in-out}
.floating-icon:nth-child(5){animation:float2 8s infinite alternate ease-in-out}
.floating-icon:nth-child(6){animation:float3 6s infinite alternate ease-in-out}

@keyframes float1{
    from{transform:translate(0,0) rotate(0)}
    to{transform:translate(40px,45px) rotate(18deg)}
}

@keyframes float2{
    from{transform:translate(0,0) rotate(0)}
    to{transform:translate(-35px,35px) rotate(-15deg)}
}

@keyframes float3{
    from{transform:translate(0,0) rotate(0)}
    to{transform:translate(25px,-35px) rotate(20deg)}
}

/* =========================
   MENU BUTTON
========================= */

.menu-toggle{
    position:fixed;
    top:20px;
    right:20px;
    z-index:998;
    width:46px;
    height:46px;
    border-radius:15px;
    background:
        linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.025));
    border:1px solid rgba(255,255,255,.13);
    box-shadow:
        0 10px 35px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.08);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:.3s;
    backdrop-filter:blur(20px);
}

.menu-toggle:hover{
    border-color:rgba(255,255,255,.3);
    box-shadow:
        0 0 35px rgba(255,255,255,.08),
        inset 0 1px 0 rgba(255,255,255,.1);
}

.menu-toggle span,
.menu-toggle span::before,
.menu-toggle span::after{
    width:19px;
    height:2px;
    border-radius:10px;
    background:#ddd;
    position:absolute;
    content:'';
}

.menu-toggle span::before{top:-6px}
.menu-toggle span::after{top:6px}

/* =========================
   SIDE MENU
========================= */

.side-menu{
    position:fixed;
    top:15px;
    right:15px;
    width:255px;
    height:calc(100vh - 30px);
    padding:28px 20px;
    background:
        linear-gradient(145deg,rgba(18,18,18,.97),rgba(3,3,3,.97));
    border:1px solid rgba(255,255,255,.12);
    border-radius:27px;
    box-shadow:
        -25px 0 70px rgba(0,0,0,.65),
        inset 0 1px 0 rgba(255,255,255,.07);
    backdrop-filter:blur(30px);
    z-index:1000;
    transform:translateX(285px);
    transition:transform .45s cubic-bezier(.16,1,.3,1);
    display:flex;
    flex-direction:column;
    gap:25px;
}

.side-menu.open{
    transform:translateX(0);
}

.side-menu-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(4px);
    z-index:999;
    opacity:0;
    pointer-events:none;
    transition:.4s;
}

.side-menu-overlay.active{
    opacity:1;
    pointer-events:auto;
}

.side-menu-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.side-menu-header{
    font-size:20px;
    font-weight:900;
    letter-spacing:.5px;
}

.side-menu-header::before{
    content:'FG ';
    color:#777;
}

.side-menu-close{
    width:34px;
    height:34px;
    border-radius:11px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.1);
    cursor:pointer;
    position:relative;
}

.side-menu-close::before,
.side-menu-close::after{
    content:'';
    position:absolute;
    width:14px;
    height:1.5px;
    background:#aaa;
    top:50%;
    left:50%;
}

.side-menu-close::before{
    transform:translate(-50%,-50%) rotate(45deg);
}

.side-menu-close::after{
    transform:translate(-50%,-50%) rotate(-45deg);
}

.menu-section{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.menu-section-label{
    font-size:10px;
    color:#555;
    font-weight:800;
    letter-spacing:2px;
    padding:0 5px;
    margin-bottom:3px;
}

.menu-btn{
    width:100%;
    padding:13px 14px;
    color:#ddd;
    background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
    border:1px solid rgba(255,255,255,.08);
    border-radius:13px;
    font-size:13px;
    font-weight:700;
    text-align:center;
    transition:.3s;
}

.menu-btn:hover{
    background:rgba(255,255,255,.08);
    border-color:rgba(255,255,255,.22);
    color:#fff;
    transform:translateY(-1px);
}

.menu-btn.full{
    font-size:14px;
}

.menu-row{
    display:flex;
    gap:8px;
}

.menu-row .menu-btn{
    flex:1;
}

/* =========================
   MAIN
========================= */

.main-container{
    position:relative;
    z-index:1;
    width:100%;
    max-width:1200px;
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-top:25px;
}

.section-title{
    position:relative;
    font-size:36px;
    font-weight:900;
    color:#fff;
    margin-bottom:38px;
    text-shadow:
        0 0 25px rgba(255,255,255,.16);
}

.section-title::before{
    content:'';
    position:absolute;
    bottom:-13px;
    left:50%;
    transform:translateX(-50%);
    width:55px;
    height:2px;
    border-radius:10px;
    background:linear-gradient(90deg,transparent,#fff,transparent);
    box-shadow:0 0 15px rgba(255,255,255,.35);
}

.section-title::after{
    content:'FG';
    position:absolute;
    font-size:9px;
    color:#555;
    letter-spacing:4px;
    bottom:-30px;
    left:50%;
    transform:translateX(-50%);
}

/* =========================
   CARDS
========================= */

.cards-grid{
    width:100%;
    display:flex;
    justify-content:center;
    gap:28px;
    flex-wrap:wrap;
}

.card{
    position:relative;
    width:100%;
    max-width:550px;
    min-width:320px;
    padding:18px 18px 24px;
    border-radius:27px;
    background:
        linear-gradient(145deg,rgba(20,20,20,.88),rgba(5,5,5,.94));
    border:1px solid rgba(255,255,255,.09);
    box-shadow:
        0 25px 70px rgba(0,0,0,.65),
        inset 0 1px 0 rgba(255,255,255,.055);
    backdrop-filter:blur(20px);
    overflow:hidden;
    cursor:pointer;
    opacity:0;
    transform:translateY(18px);
    transition:
        opacity .6s ease,
        transform .6s cubic-bezier(.25,1,.5,1),
        border-color .35s,
        box-shadow .35s;
}

.card::before{
    content:'';
    position:absolute;
    top:-1px;
    left:15%;
    right:15%;
    height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
}

.card::after{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(
        135deg,
        rgba(255,255,255,.045),
        transparent 35%,
        transparent 65%,
        rgba(255,255,255,.018)
    );
    pointer-events:none;
}

.card.reveal{
    opacity:1;
    transform:translateY(0);
}

.card.highlighted{
    border-color:rgba(255,255,255,.28);
    box-shadow:
        0 30px 90px rgba(0,0,0,.8),
        0 0 45px rgba(255,255,255,.08),
        inset 0 1px 0 rgba(255,255,255,.1);
    transform:translateY(-4px);
}

.app-img{
    position:relative;
    z-index:1;
    width:100%;
    height:auto;
    aspect-ratio:16/10;
    object-fit:cover;
    border-radius:19px;
    margin-bottom:20px;
    background:#050505;
    box-shadow:
        0 15px 40px rgba(0,0,0,.55),
        0 0 0 1px rgba(255,255,255,.05);
}

.name{
    position:relative;
    z-index:1;
    font-size:28px;
    font-weight:900;
    color:#fff;
    text-shadow:0 0 20px rgba(255,255,255,.13);
}

.version{
    position:relative;
    z-index:1;
    font-size:12px;
    font-weight:600;
    color:#666;
    margin-top:2px;
}

/* =========================
   DOWNLOAD
========================= */

.download-btn{
    position:relative;
    z-index:2;
    width:100%;
    margin-top:20px;
    padding:14px;
    border-radius:14px;
    color:#fff;
    font-size:15px;
    font-weight:800;
    text-align:center;
    background:
        linear-gradient(145deg,#151515,#080808);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:
        0 10px 25px rgba(0,0,0,.4),
        inset 0 1px 0 rgba(255,255,255,.06);
    transition:.3s;
}

.download-btn:hover{
    transform:translateY(-2px);
    border-color:rgba(255,255,255,.3);
    background:linear-gradient(145deg,#1b1b1b,#0b0b0b);
    box-shadow:
        0 15px 35px rgba(0,0,0,.55),
        0 0 25px rgba(255,255,255,.06);
}

.download-btn.loading{
    opacity:.55;
    pointer-events:none;
}

/* =========================
   SOCIAL LINKS
========================= */

.links{
    display:flex;
    gap:12px;
    justify-content:center;
    margin-top:48px;
    opacity:0;
    transform:translateY(15px);
    transition:.6s;
}

.links.reveal{
    opacity:1;
    transform:translateY(0);
}

.link-btn{
    width:52px;
    height:52px;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        linear-gradient(145deg,rgba(20,20,20,.9),rgba(5,5,5,.9));
    border:1px solid rgba(255,255,255,.1);
    box-shadow:
        0 10px 30px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.05);
    transition:.3s;
}

.link-btn:hover{
    transform:translateY(-3px);
    border-color:rgba(255,255,255,.25);
    box-shadow:
        0 15px 40px rgba(0,0,0,.65),
        0 0 25px rgba(255,255,255,.06);
}

.link-btn svg{
    width:22px;
    height:22px;
    fill:#888;
    transition:.3s;
}

.link-btn:hover svg{
    fill:#fff;
}

/* =========================
   MOBILE
========================= */

@media(max-width:767px){

    body{
        padding:30px 15px;
    }

    .main-container{
        margin-top:25px;
    }

    .section-title{
        font-size:29px;
        margin-bottom:34px;
    }

    .cards-grid{
        gap:18px;
    }

    .card{
        min-width:0;
        padding:14px 14px 20px;
        border-radius:23px;
    }

    .app-img{
        border-radius:16px;
    }

    .name{
        font-size:25px;
    }

    .side-menu{
        width:calc(100% - 30px);
        max-width:330px;
    }
}

@media(min-width:768px){

    body{
        align-items:center;
    }

    .main-container{
        margin-top:0;
    }

    .cards-grid{
        flex-wrap:nowrap;
    }

    .card{
        flex:1;
    }
}
</style>
</head>

<script>

/* =========================
   MENU
========================= */

function toggleMenu(){
    document.getElementById('side-menu').classList.toggle('open');
    document.querySelector('.side-menu-overlay').classList.toggle('active');
}

function closeMenu(){
    document.getElementById('side-menu').classList.remove('open');
    document.querySelector('.side-menu-overlay').classList.remove('active');
}

document.addEventListener('keydown',function(e){
    if(e.key==='Escape') closeMenu();
});


/* =========================
   FLOATING FG ICONS
========================= */

function createFloatingIcons(){

    const layer=document.getElementById('floatingIconsLayer');

    if(!layer || typeof lucide==='undefined'){
        setTimeout(createFloatingIcons,100);
        return;
    }

    layer.innerHTML='';

    const icons=[
        'code-xml',
        'terminal',
        'star',
        'sparkles',
        'crown',
        'zap'
    ];

    icons.forEach((iconName,i)=>{

        const wrapper=document.createElement('div');

        wrapper.className='floating-icon';

        const size=60+i*6;

        wrapper.style.width=size+'px';
        wrapper.style.height=size+'px';

        if(i<3){
            wrapper.style.left=(8+i*28)%92+'%';
            wrapper.style.top=(4+i*12)%35+'%';
        }else{
            wrapper.style.left=(12+(i-3)*30)%90+'%';
            wrapper.style.top=(62+(i-3)*10)%88+'%';
        }

        const icon=document.createElement('i');

        icon.setAttribute('data-lucide',iconName);

        wrapper.appendChild(icon);
        layer.appendChild(wrapper);

    });

    lucide.createIcons();
}


/* =========================
   PAGE REVEAL
========================= */

document.addEventListener('DOMContentLoaded',function(){

    createFloatingIcons();

    const title=document.getElementById('sec-title');
    const card1=document.getElementById('card-1');
    const card2=document.getElementById('card-2');
    const links=document.getElementById('sec-links');

    title.style.opacity='0';
    title.style.transform='translateY(15px)';
    title.style.transition='.6s';

    setTimeout(()=>{
        title.style.opacity='1';
        title.style.transform='translateY(0)';
    },50);

    setTimeout(()=>{
        card1.classList.add('reveal');
    },150);

    setTimeout(()=>{
        card2.classList.add('reveal');
    },250);

    setTimeout(()=>{
        links.classList.add('reveal');
    },350);

});


/* =========================
   CARD HIGHLIGHT
========================= */

let currentHighlighted=null;

function highlightCard(card,event){

    event.stopPropagation();

    if(currentHighlighted && currentHighlighted!==card){
        currentHighlighted.classList.remove('highlighted');
    }

    if(card.classList.contains('highlighted')){

        card.classList.remove('highlighted');
        currentHighlighted=null;

    }else{

        card.classList.add('highlighted');
        currentHighlighted=card;

    }
}

document.addEventListener('click',function(e){

    if(!e.target.closest('.card') && currentHighlighted){

        currentHighlighted.classList.remove('highlighted');
        currentHighlighted=null;

    }

});


/* =========================
   DOWNLOAD
========================= */

function downloadWithDelay(event,url){

    event.preventDefault();
    event.stopPropagation();

    const btn=event.currentTarget;

    if(btn.classList.contains('loading')) return;

    btn.classList.add('loading');

    const oldText=btn.textContent;

    btn.textContent='جاري التحضير...';

    setTimeout(()=>{

        btn.classList.remove('loading');
        btn.textContent=oldText;

        window.open(url,'_blank');

    },1000);
}


/* =========================
   SECURITY / UI
========================= */

document.addEventListener('contextmenu',e=>e.preventDefault());

document.addEventListener('keydown',function(e){

    if(
        e.ctrlKey &&
        ['u','s','p','c'].includes(e.key.toLowerCase())
    ){
        e.preventDefault();
    }

});
